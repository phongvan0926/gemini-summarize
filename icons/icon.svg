<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E8CFF"/>
      <stop offset="35%" stop-color="#7B61FF"/>
      <stop offset="70%" stop-color="#FF5C93"/>
      <stop offset="100%" stop-color="#FFAE42"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle border -->
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Main Gemini 4-point Sparkle Star -->
  <path d="M 64 16 
           C 64 42.5 85.5 64 112 64 
           C 85.5 64 64 85.5 64 112 
           C 64 85.5 42.5 64 16 64 
           C 42.5 64 64 42.5 64 16 Z" 
        fill="url(#geminiGrad)" 
        filter="url(#glow)"/>

  <!-- Smaller top-right companion sparkle -->
  <path d="M 94 22 
           C 94 31.5 101.5 39 111 39 
           C 101.5 39 94 46.5 94 56 
           C 94 46.5 86.5 39 77 39 
           C 86.5 39 94 31.5 94 22 Z" 
        fill="url(#sparkleGrad)" opacity="0.9"/>

  <!-- Tiny bottom-left sparkle -->
  <path d="M 32 82 
           C 32 87 36 91 41 91 
           C 36 91 32 95 32 100 
           C 32 95 28 91 23 91 
           C 28 91 32 87 32 82 Z" 
        fill="url(#sparkleGrad)" opacity="0.8"/>
</svg>
